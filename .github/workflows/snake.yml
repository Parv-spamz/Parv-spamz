name: Generate contribution snake

on:
  schedule:
    # Run automatically every day at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Deploy SVGs to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output-temp
          git reset
          mv dist/github-snake.svg ./github-snake.svg
          mv dist/github-snake-dark.svg ./github-snake-dark.svg
          git add github-snake.svg github-snake-dark.svg
          git commit -m "Generate contribution snake SVGs"
          git push -f origin output-temp:output
